name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux · Python ${{ matrix.python }} · Chrome + PostgreSQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pruebas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMETRICKS_PG_TEST_URL: postgresql://postgres:pruebas@localhost:5432/postgres
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Verificar navegador para la prueba de descargas
        run: test -x "$CHROMIUM_PATH"
      - name: Pruebas
        run: python -m pytest -v -rs

  windows:
    name: Windows · Python 3.13 · Edge
    runs-on: windows-latest
    env:
      CHROMIUM_PATH: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Verificar navegador para la prueba de descargas
        shell: pwsh
        run: if (-not (Test-Path $env:CHROMIUM_PATH)) { throw "No se encontró Edge en $env:CHROMIUM_PATH" }
      - name: Pruebas
        run: python -m pytest -v -rs
